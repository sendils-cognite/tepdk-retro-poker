<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Retro Poker | TEPDK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .vote-card { transition: all 0.2s ease-in-out; }
        .vote-card:active { transform: scale(0.95); }
        .selected-true { box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); border-color: #22c55e; }
        .selected-false { box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); border-color: #ef4444; }
        .picked-user {
            animation: pulse-ring 2s infinite;
            border-color: #fbbf24 !important;
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.5);
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(251, 191, 36, 0); }
            100% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-20px]">
        <div class="bg-indigo-600 text-white px-6 py-3 rounded-full shadow-lg font-medium text-sm flex items-center gap-2">
            <i class="ph ph-check-circle text-lg"></i>
            <span id="toast-message">Notification</span>
        </div>
    </div>

    <div id="app-container" class="flex-grow flex flex-col relative">
        <div id="login-screen" class="absolute inset-0 z-40 flex items-center justify-center p-4 bg-[#0f172a] min-h-screen">
            <div class="glass-panel p-8 rounded-2xl w-full max-w-md shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-500/20 text-indigo-400 mb-4">
                        <i class="ph ph-cards text-3xl"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-white tracking-tight">Retro Poker</h1>
                    <p class="text-slate-400 mt-2 text-sm">Ten True / False statements for the TEPDK retrospective. No account. Anyone with the link can vote.</p>
                </div>
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1.5" for="nickname-input">Your name</label>
                        <input type="text" id="nickname-input" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" placeholder="e.g. Shibin" maxlength="40">
                    </div>
                    <button id="join-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl transition-colors shadow-lg shadow-indigo-500/30 flex items-center justify-center gap-2">
                        <span id="join-btn-text">Create session</span>
                        <i class="ph ph-arrow-right font-bold"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="poker-screen" class="hidden flex-col h-full w-full max-w-6xl mx-auto p-4 md:p-6 lg:p-8">
            <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 glass-panel p-4 rounded-2xl">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-500/40">
                        <i class="ph ph-cards text-xl text-white"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-white leading-tight">TEPDK Retro</h2>
                        <div class="flex items-center gap-2 text-xs font-medium text-slate-400">
                            <span class="flex items-center gap-1"><i class="ph ph-hash"></i><span id="display-session-id">...</span></span>
                            <span id="live-status" class="text-amber-400">Connecting</span>
                        </div>
                    </div>
                </div>
                <button id="copy-link" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium transition-colors border border-slate-700">
                    <i class="ph ph-link text-lg"></i>
                    Copy invite link
                </button>
            </header>

            <div class="flex-grow flex flex-col gap-6">
                <div class="glass-panel rounded-2xl p-6 relative border border-slate-700/50">
                    <div class="absolute -top-3 left-6 bg-slate-800 px-3 py-0.5 rounded-full text-xs font-semibold text-indigo-400 border border-slate-700 flex items-center gap-1.5">
                        <i class="ph ph-chat-centered-text"></i>
                        <span id="statement-count">Statement 1 of 10</span>
                    </div>
                    <p id="statement-text" class="text-white text-xl md:text-2xl font-medium mt-3 leading-snug"></p>
                    <div class="flex items-center justify-between mt-6 gap-3">
                        <button id="prev-btn" class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 font-medium py-2 px-4 rounded-xl border border-slate-700 flex items-center gap-2">
                            <i class="ph ph-caret-left"></i> Previous
                        </button>
                        <p class="text-xs text-slate-500">Same statement for everyone in this room</p>
                        <button id="next-btn" class="bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 font-medium py-2 px-4 rounded-xl border border-slate-700 flex items-center gap-2">
                            Next <i class="ph ph-caret-right"></i>
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button id="btn-true" class="vote-card group relative overflow-hidden rounded-2xl border-2 border-slate-700 bg-slate-800/50 p-8 flex flex-col items-center justify-center gap-3 hover:bg-slate-800 hover:border-green-500/50">
                        <div class="absolute inset-0 bg-gradient-to-br from-green-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <div class="w-16 h-16 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center text-green-500 group-hover:scale-110 transition-transform group-hover:bg-green-500/20">
                            <i class="ph-fill ph-check-circle text-4xl"></i>
                        </div>
                        <span class="text-2xl font-bold text-white tracking-wide">TRUE</span>
                    </button>
                    <button id="btn-false" class="vote-card group relative overflow-hidden rounded-2xl border-2 border-slate-700 bg-slate-800/50 p-8 flex flex-col items-center justify-center gap-3 hover:bg-slate-800 hover:border-red-500/50">
                        <div class="absolute inset-0 bg-gradient-to-br from-red-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <div class="w-16 h-16 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center text-red-500 group-hover:scale-110 transition-transform group-hover:bg-red-500/20">
                            <i class="ph-fill ph-x-circle text-4xl"></i>
                        </div>
                        <span class="text-2xl font-bold text-white tracking-wide">FALSE</span>
                    </button>
                </div>

                <div id="comment-wrap" class="hidden glass-panel rounded-2xl p-4">
                    <label for="comment-input" class="block text-sm font-medium text-slate-300 mb-2">Why did you choose this?</label>
                    <textarea id="comment-input" rows="2" maxlength="500" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Optional if you voted True. Add the reason if you voted False."></textarea>
                </div>

                <div id="chart" class="hidden glass-panel rounded-2xl p-6">
                    <h3 class="text-sm font-semibold text-slate-300 mb-4">This statement</h3>
                    <div class="space-y-3">
                        <div>
                            <div class="flex justify-between text-sm mb-1"><span class="text-green-400 font-semibold">True</span><span id="true-count" class="text-slate-300">0</span></div>
                            <div class="h-3 rounded-full bg-slate-800 overflow-hidden"><div id="true-bar" class="h-full bg-green-500 rounded-full" style="width:0%"></div></div>
                        </div>
                        <div>
                            <div class="flex justify-between text-sm mb-1"><span class="text-red-400 font-semibold">False</span><span id="false-count" class="text-slate-300">0</span></div>
                            <div class="h-3 rounded-full bg-slate-800 overflow-hidden"><div id="false-bar" class="h-full bg-red-500 rounded-full" style="width:0%"></div></div>
                        </div>
                    </div>
                </div>

                <div class="flex flex-wrap items-center justify-center gap-4 py-2">
                    <button id="btn-reveal" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-8 rounded-xl shadow-lg shadow-indigo-500/30 transition-all flex items-center gap-2">
                        <i class="ph ph-eye text-lg"></i> <span id="reveal-text">Reveal votes</span>
                    </button>
                    <button id="btn-reset" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-3 px-6 rounded-xl border border-slate-700 transition-all flex items-center gap-2">
                        <i class="ph ph-arrow-counter-clockwise text-lg"></i> Reset this statement
                    </button>
                    <button id="btn-pick" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3 px-6 rounded-xl shadow-lg shadow-amber-500/20 transition-all flex items-center gap-2">
                        <i class="ph ph-target text-lg"></i> Pick participant to speak
                    </button>
                </div>

                <div class="glass-panel rounded-2xl p-6 border border-slate-700/50 flex-grow mb-8">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                            <i class="ph-fill ph-users-three text-slate-400"></i> Participants
                            <span id="voter-count" class="bg-slate-800 text-slate-300 text-xs py-1 px-2.5 rounded-full ml-2">0/0 voted</span>
                        </h3>
                    </div>
                    <div id="participants-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STATEMENTS = [
            "I believe that training has been provided sufficient for CDF deployment of TEPDK",
            "We know what done looks like for TEPDK",
            "A reference example or template was available, and I knew where to find it.",
            "Deploying through Toolkit and a pipeline felt like the faster way to deliver, not the slower one.",
            "Timelines gave us room to do things the right way, not just get data in by milestones.",
            "Someone in the workstreams reviews technical work before it reaches Cognite / Total Energies.",
            "When we're stuck, we know who to ask at Cognite and get answers quickly.",
            "Work starts when its prerequisites (data, parameters, analysis) are ready.",
            "When advice is given, we either apply it or it is clear there are good reasons not to.",
            "When we solve a problem, the lesson is written down where the next person will find it."
        ];

        const ME = localStorage.getItem("retro-me") || crypto.randomUUID();
        localStorage.setItem("retro-me", ME);

        const params = new URLSearchParams(location.search);
        let room = params.get("room");
        let myName = sessionStorage.getItem("retro-name") || "";
        let source = null;
        let seen = new Set();
        let ops = [];
        let commentTimer = null;
        let state = emptyState();

        const loginScreen = document.getElementById("login-screen");
        const pokerScreen = document.getElementById("poker-screen");
        const nicknameInput = document.getElementById("nickname-input");
        const joinBtn = document.getElementById("join-btn");
        const joinBtnText = document.getElementById("join-btn-text");

        if (room) joinBtnText.textContent = "Join session";
        if (myName) nicknameInput.value = myName;
        nicknameInput.focus();

        nicknameInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") joinOrCreate();
        });
        joinBtn.addEventListener("click", joinOrCreate);
        document.getElementById("btn-true").addEventListener("click", () => castVote("True"));
        document.getElementById("btn-false").addEventListener("click", () => castVote("False"));
        document.getElementById("prev-btn").addEventListener("click", () => move(-1));
        document.getElementById("next-btn").addEventListener("click", () => move(1));
        document.getElementById("btn-reveal").addEventListener("click", toggleReveal);
        document.getElementById("btn-reset").addEventListener("click", resetStatement);
        document.getElementById("btn-pick").addEventListener("click", pickParticipant);
        document.getElementById("copy-link").addEventListener("click", copyInviteLink);
        document.getElementById("comment-input").addEventListener("input", () => {
            clearTimeout(commentTimer);
            commentTimer = setTimeout(syncComment, 500);
        });

        function emptyState() {
            return { users: {}, votes: {}, index: 0, revealed: {}, picked: null, controlAt: {} };
        }

        function joinOrCreate() {
            const name = nicknameInput.value.trim();
            if (!name) {
                showToast("Enter your name");
                return;
            }
            myName = name;
            sessionStorage.setItem("retro-name", name);
            if (!room) {
                room = "rp" + crypto.randomUUID().replaceAll("-", "");
                const url = new URL(location.href);
                url.searchParams.set("room", room);
                history.replaceState(null, "", url);
            }
            joinBtn.disabled = true;
            joinBtnText.textContent = "Connecting...";
            loginScreen.classList.add("hidden");
            pokerScreen.classList.remove("hidden");
            pokerScreen.classList.add("flex");
            document.getElementById("display-session-id").textContent = room.slice(-6).toUpperCase();
            render();
            connect();
            send({ t: "join", id: ME, name: myName });
        }

        function connect() {
            if (source) source.close();
            source = new EventSource("https://ntfy.sh/" + room + "/sse?since=all");
            source.onopen = () => setLive("Live", "text-green-400");
            source.onerror = () => setLive("Reconnecting", "text-amber-400");
            source.onmessage = (event) => {
                let data;
                try { data = JSON.parse(event.data); } catch { return; }
                if (!data || data.event !== "message" || seen.has(data.id)) return;
                seen.add(data.id);
                let op;
                try { op = JSON.parse(data.message); } catch { return; }
                op.at = data.time || op.at || 0;
                ops.push(op);
                rebuild();
            };
        }

        function setLive(text, color) {
            const el = document.getElementById("live-status");
            el.textContent = text;
            el.className = color;
        }

        async function send(op) {
            op.at = Date.now() / 1000;
            try {
                const response = await fetch("https://ntfy.sh/" + room, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(op)
                });
                if (!response.ok) throw new Error(String(response.status));
            } catch (error) {
                console.error(error);
                showToast("Could not sync. Check the connection and try again.");
            }
        }

        function rebuild() {
            const next = emptyState();
            const ordered = ops.slice().sort((a, b) => a.at - b.at);
            for (const op of ordered) {
                if (op.t === "join" && op.id && op.name) {
                    next.users[op.id] = { name: String(op.name).slice(0, 40), at: op.at };
                } else if (op.t === "nav" && Number.isInteger(op.i) && op.at >= (next.controlAt.nav || 0)) {
                    next.index = clampIndex(op.i);
                    next.controlAt.nav = op.at;
                } else if (op.t === "reveal" && Number.isInteger(op.i) && op.at >= (next.controlAt["r" + op.i] || 0)) {
                    next.revealed[op.i] = Boolean(op.on);
                    next.controlAt["r" + op.i] = op.at;
                } else if (op.t === "pick" && op.at >= (next.controlAt.pick || 0)) {
                    next.picked = op.uid || null;
                    next.controlAt.pick = op.at;
                } else if (op.t === "reset" && Number.isInteger(op.i)) {
                    next.votes[op.i] = {};
                    next.controlAt["x" + op.i] = op.at;
                    next.revealed[op.i] = false;
                    next.picked = null;
                } else if (op.t === "vote" && op.id && Number.isInteger(op.i)) {
                    const resetAt = next.controlAt["x" + op.i] || 0;
                    if (op.at >= resetAt) {
                        next.votes[op.i] = next.votes[op.i] || {};
                        const current = next.votes[op.i][op.id];
                        if (!current || op.at >= current.at) {
                            next.votes[op.i][op.id] = {
                                value: op.value === "True" || op.value === "False" ? op.value : null,
                                comment: String(op.comment || "").slice(0, 500),
                                at: op.at
                            };
                        }
                    }
                }
            }
            state = next;
            render();
        }

        function clampIndex(index) {
            return Math.max(0, Math.min(STATEMENTS.length - 1, index));
        }

        function myVote() {
            return state.votes[state.index]?.[ME] || null;
        }

        function render() {
            const index = clampIndex(state.index || 0);
            const revealed = Boolean(state.revealed[index]);
            document.getElementById("statement-count").textContent = "Statement " + (index + 1) + " of " + STATEMENTS.length;
            document.getElementById("statement-text").textContent = STATEMENTS[index];
            document.getElementById("prev-btn").disabled = index === 0;
            document.getElementById("next-btn").disabled = index === STATEMENTS.length - 1;

            const vote = myVote();
            document.getElementById("btn-true").classList.toggle("selected-true", vote?.value === "True");
            document.getElementById("btn-false").classList.toggle("selected-false", vote?.value === "False");

            const commentWrap = document.getElementById("comment-wrap");
            const commentInput = document.getElementById("comment-input");
            commentWrap.classList.toggle("hidden", !vote?.value);
            if (document.activeElement !== commentInput) commentInput.value = vote?.comment || "";

            const votes = Object.values(state.votes[index] || {}).filter((item) => item.value);
            const trues = votes.filter((item) => item.value === "True").length;
            const falses = votes.filter((item) => item.value === "False").length;
            const chart = document.getElementById("chart");
            chart.classList.toggle("hidden", !revealed);
            const totalVotes = trues + falses;
            document.getElementById("true-count").textContent = String(trues);
            document.getElementById("false-count").textContent = String(falses);
            document.getElementById("true-bar").style.width = (totalVotes ? (trues / totalVotes) * 100 : 0) + "%";
            document.getElementById("false-bar").style.width = (totalVotes ? (falses / totalVotes) * 100 : 0) + "%";

            const revealText = document.getElementById("reveal-text");
            revealText.textContent = revealed ? "Hide votes" : "Reveal votes";

            const people = Object.entries(state.users).sort((a, b) => a[1].at - b[1].at);
            const voted = people.filter(([id]) => state.votes[index]?.[id]?.value).length;
            document.getElementById("voter-count").textContent = voted + "/" + people.length + " voted";

            const grid = document.getElementById("participants-grid");
            grid.replaceChildren();
            for (const [id, person] of people) {
                const card = document.createElement("div");
                const mine = id === ME;
                const picked = id === state.picked;
                const choice = state.votes[index]?.[id];
                card.className = "relative bg-slate-800/80 border rounded-xl p-4 flex flex-col items-center justify-center gap-3 " +
                    (picked ? "border-amber-400 picked-user scale-105 z-10" : mine ? "border-indigo-500/50" : "border-slate-700");

                if (picked) {
                    const badge = document.createElement("div");
                    badge.className = "absolute -top-3 -right-3 bg-amber-500 text-white p-1.5 rounded-full shadow-lg";
                    badge.innerHTML = '<i class="ph-fill ph-microphone-stage text-lg"></i>';
                    card.appendChild(badge);
                }

                const avatar = document.createElement("div");
                avatar.className = "w-12 h-12 rounded-full flex items-center justify-center shadow-inner text-white font-bold text-lg " + (mine ? "bg-indigo-600" : "bg-slate-700");
                avatar.textContent = initials(person.name);
                card.appendChild(avatar);

                const name = document.createElement("h4");
                name.className = "text-slate-200 font-semibold truncate text-sm px-1 text-center w-full";
                name.textContent = person.name + (mine ? " (You)" : "");
                card.appendChild(name);

                const status = document.createElement("div");
                status.className = "w-full flex justify-center";
                const pill = document.createElement("div");
                if (!revealed) {
                    if (choice?.value) {
                        pill.className = "bg-green-500/20 text-green-400 border border-green-500/30 px-3 py-1 rounded-lg text-sm font-bold";
                        pill.textContent = "Voted";
                    } else {
                        pill.className = "bg-slate-900 text-slate-400 border border-slate-700 px-3 py-1 rounded-lg text-sm";
                        pill.textContent = "Thinking";
                    }
                } else if (choice?.value === "True") {
                    pill.className = "bg-green-500 text-white px-4 py-1.5 rounded-lg text-base font-bold w-full text-center";
                    pill.textContent = "TRUE";
                } else if (choice?.value === "False") {
                    pill.className = "bg-red-500 text-white px-4 py-1.5 rounded-lg text-base font-bold w-full text-center";
                    pill.textContent = "FALSE";
                } else {
                    pill.className = "bg-slate-900 text-slate-500 border border-slate-700 px-3 py-1 rounded-lg text-sm w-full text-center";
                    pill.textContent = "No vote";
                }
                status.appendChild(pill);
                card.appendChild(status);

                if (revealed && choice?.comment) {
                    const note = document.createElement("p");
                    note.className = "text-xs text-slate-300 text-center leading-snug";
                    note.textContent = choice.comment;
                    card.appendChild(note);
                }
                grid.appendChild(card);
            }
        }

        function initials(name) {
            const parts = String(name || "?").trim().split(/\s+/).slice(0, 2);
            return parts.map((part) => part[0] || "").join("").toUpperCase() || "?";
        }

        function castVote(value) {
            const current = myVote();
            const nextValue = current?.value === value ? null : value;
            send({
                t: "vote",
                id: ME,
                i: state.index || 0,
                value: nextValue,
                comment: document.getElementById("comment-input").value.trim()
            });
        }

        function syncComment() {
            const current = myVote();
            if (!current?.value) return;
            send({
                t: "vote",
                id: ME,
                i: state.index || 0,
                value: current.value,
                comment: document.getElementById("comment-input").value.trim()
            });
        }

        function move(delta) {
            send({ t: "nav", i: clampIndex((state.index || 0) + delta) });
        }

        function toggleReveal() {
            const index = state.index || 0;
            send({ t: "reveal", i: index, on: !state.revealed[index] });
        }

        function resetStatement() {
            send({ t: "reset", i: state.index || 0 });
            document.getElementById("comment-input").value = "";
        }

        function pickParticipant() {
            const ids = Object.keys(state.users);
            if (!ids.length) return;
            const uid = ids[Math.floor(Math.random() * ids.length)];
            send({ t: "pick", uid });
        }

        function copyInviteLink() {
            const url = new URL(location.href);
            url.searchParams.set("room", room);
            const text = url.toString();
            if (navigator.clipboard?.writeText) {
                navigator.clipboard.writeText(text).then(() => showToast("Invite link copied"));
                return;
            }
            const area = document.createElement("textarea");
            area.value = text;
            document.body.appendChild(area);
            area.select();
            document.execCommand("copy");
            area.remove();
            showToast("Invite link copied");
        }

        function showToast(message) {
            document.getElementById("toast-message").textContent = message;
            const toast = document.getElementById("toast");
            toast.classList.remove("opacity-0", "pointer-events-none", "translate-y-[-20px]");
            setTimeout(() => toast.classList.add("opacity-0", "pointer-events-none", "translate-y-[-20px]"), 3000);
        }
    </script>
</body>
</html>
